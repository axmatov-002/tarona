<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="O'z musiqalaringizni saqlang va istalgan vaqt tinglang. Zamonaviy, xavfsiz va qulay React musiqiy veb-pleyer." />
    <meta name="theme-color" content="#0a0c14" />
    <title>X_terminal - Shaxsiy Musiqa Pleyeri</title>
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().then((persistent) => {
          console.log('Doimiy xotira (Persistent storage):', persistent ? 'Faol' : 'Standart');
        });
      }
    </script>
  </body>
</html>
